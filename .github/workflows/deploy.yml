name: Build and Deploy to AKS

on:
  push:
    branches: [ main ]

env:
  ACR_NAME: devopsenterpriseacr6267
  IMAGE_NAME: flask-aks-app
  AKS_CLUSTER: enterprise-aks
  RESOURCE_GROUP: rg-devops-enterprise

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Azure login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Build and push image to ACR
      run: |
        az acr build \
          --registry $ACR_NAME \
          --image $IMAGE_NAME:${{ github.sha }} \
          ./app

    - name: Get AKS credentials
      run: |
        az aks get-credentials \
          --resource-group $RESOURCE_GROUP \
          --name $AKS_CLUSTER \
          --overwrite-existing

    - name: Deploy to AKS
      run: |
        kubectl set image deployment/flask-aks-app \
          flask-aks-app=$ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }} \
          -n devops-app

        kubectl rollout status deployment/flask-aks-app -n devops-app
