apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-aks-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-aks-app
  template:
    metadata:
      labels:
        app: flask-aks-app
    spec:
      containers:
      - name: flask-aks-app
        image: devopsenterpriseacr6267.azurecr.io/flask-aks-app:v1
        ports:
        - containerPort: 5000
